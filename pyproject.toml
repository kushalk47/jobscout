[project]
name = "wellfound-mcp"
version = "0.1.0"
description = "A small, token-lean MCP server for finding and applying to jobs on Wellfound, with human approval before every submission."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp>=1.27,<2",
  "playwright>=1.54,<2",
  "platformdirs>=4,<5",
]

[project.scripts]
wellfound-mcp = "wellfound_mcp.server:main"
wellfound-mcp-login = "wellfound_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellfound_mcp"]
