version: 2
project_name: jobscout
builds:
  - id: jobscout-mcp
    main: ./cmd/jobscout-mcp
    binary: jobscout-mcp
    env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  use: github
